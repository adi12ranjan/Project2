<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#0A0D12; --panel:#10151C; --panel-2:#151B23; --border:#232B36;
  --text:#E7ECF2; --text-dim:#8B96A3; --text-faint:#4E5967;
  --cyan:#4FD8E8; --green:#35D08C; --red:#FF5B5B;
  --sans:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  width:300px; background:var(--bg); color:var(--text); font-family:var(--sans);
  padding:18px;
}
.brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.mark{ width:32px; height:32px; border-radius:8px; background:linear-gradient(155deg,var(--cyan),#1A6E78); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.mark svg{ width:17px; height:17px; }
.brand-text .t1{ font-size:14px; font-weight:700; }
.brand-text .t2{ font-size:10px; color:var(--text-faint); font-family:var(--mono); margin-top:2px; }

.status-row{
  display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; margin-bottom:14px; font-size:11.5px; color:var(--text-dim);
}
.dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }

.btn{
  width:100%; font-family:var(--sans); font-weight:600; font-size:13px;
  padding:12px; border-radius:9px; border:1px solid var(--border);
  background:var(--cyan); color:#062327; cursor:pointer; margin-bottom:9px;
}
.btn.secondary{ background:var(--panel-2); color:var(--text); }
.btn:hover{ filter:brightness(1.06); }

.foot{ font-family:var(--mono); font-size:10px; color:var(--text-faint); line-height:1.6; margin-top:6px; text-align:center; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2a4 4 0 00-4 4v6a4 4 0 008 0V6a4 4 0 00-4-4z" fill="#062327"/><path d="M5 11v1a7 7 0 0014 0v-1M12 19v3" stroke="#062327" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="brand-text">
      <div class="t1">Voice Integrity Shield</div>
      <div class="t2">AI CALL DETECTION</div>
    </div>
  </div>

  <div class="status-row"><span class="dot"></span> Monitor is not currently running</div>

  <button class="btn" id="launch">&#9679; Launch Live Monitor</button>
  <button class="btn secondary" id="openSuite">Open Full Forensic Suite</button>

  <div class="foot">Runs in its own tab so mic listening<br>keeps working while you take the call.</div>

<script>
document.getElementById('launch').addEventListener('click', ()=>{
  window.open(chrome.runtime.getURL('monitor.html'), '_blank');
});
document.getElementById('openSuite').addEventListener('click', ()=>{
  window.open(chrome.runtime.getURL('center.html'), '_blank');
});
</script>
</body>
</html>
